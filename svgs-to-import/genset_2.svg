<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 115 331" width="115" height="331" role="img" aria-labelledby="tx3-genset2-title tx3-genset2-desc">
  <title id="tx3-genset2-title">TX3 genset 2 symbol</title>
  <desc id="tx3-genset2-desc">Transparent SVG export of the TX3 genset chain symbol with upper breakers, transformer pair, feeder line, and glowing generator circle.</desc>
  <defs>
    <filter id="tx3-genset2-chain-glow" x="-240%" y="-120%" width="580%" height="340%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#10b981" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#10b981" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
    <filter id="tx3-genset2-circle-glow" x="-220%" y="-220%" width="540%" height="540%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#10b981" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#10b981" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.15"/>
    </filter>
    <radialGradient id="tx3-genset2-generator-fill" cx="50%" cy="50%" r="70%">
      <stop offset="10%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(20.5 20)">
    <g filter="url(#tx3-genset2-chain-glow)" fill="rgba(16, 185, 129, 0.02)" stroke="#10b981" stroke-width="2" stroke-linecap="square" stroke-linejoin="round">
      <line x1="17" y1="71" x2="17" y2="79"/>
      <line x1="17" y1="115" x2="17" y2="136"/>
    </g>

    <g filter="url(#tx3-genset2-chain-glow)" fill="#10b981">
      <rect x="36.5" y="168" width="2" height="48" rx="1"/>
    </g>

    <circle cx="37.5" cy="253.5" r="36.5" fill="url(#tx3-genset2-generator-fill)" stroke="#10b981" stroke-width="2" filter="url(#tx3-genset2-circle-glow)"/>
    <path d="M21.5 253.5 Q29.5 241.5 37.5 253.5 T53.5 253.5" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#tx3-genset2-circle-glow)"/>
  </g>
</svg>
